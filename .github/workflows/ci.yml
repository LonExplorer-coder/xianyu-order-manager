name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows 单 worker 全量检查（含打包）实测约 23 分钟：测试本体 ~17.5 分钟，
    # 预算需覆盖已知的运行器 I/O 争抢波动，20 分钟已被顶爆（见 9fa0d41 首跑）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run checks with bounded test workers
        run: pnpm check
        env:
          VITEST_MAX_WORKERS: 1
      - run: pnpm test:native-image-crop
      - run: pnpm test:credential-store
      - name: Build macOS portable ZIP
        if: runner.os == 'macOS'
        run: pnpm make:mac:portable
      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        run: pnpm make:windows:portable
      - name: Verify extracted portable ZIP lifecycle
        run: pnpm verify:portable
      - name: Upload macOS portable ZIP and evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: xianyu-order-manager-macos-arm64-${{ github.sha }}
          path: |
            out/make/zip/darwin/arm64/*.zip
            out/release-evidence/portable-darwin-arm64.*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows portable ZIP and evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: xianyu-order-manager-windows-x64-${{ github.sha }}
          path: |
            out/make/zip/win32/x64/*.zip
            out/release-evidence/portable-win32-x64.*
          if-no-files-found: error
          retention-days: 14
