name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:credential-store
      - run: pnpm package
      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        run: |
          test -x out/XianyuOrderManager-darwin-arm64/XianyuOrderManager.app/Contents/MacOS/XianyuOrderManager
          test -f out/XianyuOrderManager-darwin-arm64/XianyuOrderManager.app/Contents/Resources/app.asar
          test -f out/XianyuOrderManager-darwin-arm64/XianyuOrderManager.app/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs/keyring-darwin-arm64/keyring.darwin-arm64.node
          test "$(plutil -extract CFBundleIdentifier raw out/XianyuOrderManager-darwin-arm64/XianyuOrderManager.app/Contents/Info.plist)" = "com.lonexplorer.xianyu-order-manager"
          plutil -lint out/XianyuOrderManager-darwin-arm64/XianyuOrderManager.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=4 out/XianyuOrderManager-darwin-arm64/XianyuOrderManager.app
          pnpm test:packaged-credential-store
      - name: Verify Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'out/XianyuOrderManager-win32-x64/XianyuOrderManager.exe')) { throw 'Missing Windows executable' }
          if (!(Test-Path 'out/XianyuOrderManager-win32-x64/resources/app.asar')) { throw 'Missing Windows app.asar' }
          if (!(Test-Path 'out/XianyuOrderManager-win32-x64/resources/app.asar.unpacked/node_modules/@napi-rs/keyring-win32-x64-msvc/keyring.win32-x64-msvc.node')) { throw 'Missing Windows Credential Manager native module' }
          pnpm test:packaged-credential-store
